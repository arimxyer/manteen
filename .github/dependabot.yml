version: 2
updates:
  # Grouped and monthly on purpose. This repo has one maintainer, and a stream of
  # individual PRs is noise that gets ignored — which is worse than no automation,
  # because it looks like the dependencies are being watched.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
