name: CI

on:
  pull_request:
  # Manual runs deliberately exercise the full matrix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changed-paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changed-paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Fail closed: only a valid, non-empty pull-request diff containing
          # exclusively documentation paths may skip the portability matrices.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi

          sha_pattern='^[0-9a-fA-F]{40,64}$'
          if [[ ! "$BASE_SHA" =~ $sha_pattern || ! "$HEAD_SHA" =~ $sha_pattern ]]; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            exit 0
          fi
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            exit 0
          fi

          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          if ! git diff --name-status -z --no-renames "$BASE_SHA...$HEAD_SHA" -- > "$diff_file"; then
            exit 0
          fi
          if [[ ! -s "$diff_file" ]]; then
            exit 0
          fi

          mapfile -d '' -t changes < "$diff_file"
          if (( ${#changes[@]} == 0 || ${#changes[@]} % 2 != 0 )); then
            exit 0
          fi

          for ((i = 0; i < ${#changes[@]}; i += 2)); do
            status="${changes[i]}"
            path="${changes[i + 1]}"

            # Type changes and any future status are full-CI.
            if [[ ! "$status" =~ ^[AMD]$ ]]; then
              exit 0
            fi

            case "$path" in
              README.md|docs/*|apps/docs/*|apps/manteen/*|packages/cli/README.md|packages/cli/CHANGELOG.md|packages/registry-kit/README.md|packages/registry-kit/CHANGELOG.md)
                ;;
              *)
                exit 0
                ;;
            esac
          done

          echo "docs_only=true" >> "$GITHUB_OUTPUT"

  quality:
    name: Source, types, lint, guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # setup-bun caches the Bun executable, not packages. Keep the global
      # package cache exact to this runner ABI, Bun version, and lockfile; never
      # cache the repository's linked node_modules tree.
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Immediately after install, so a bad install is named as one rather than
      # surfacing later as several hundred type errors in untouched files.
      - run: node scripts/guard-workspace.mjs
      - run: bun run test
      - run: bun run build:registry
      - run: bun run build:site
      - run: bun run site:build
      - run: bun run typecheck
      - run: bun run lint
      - run: node scripts/guard-runtime-apis.mjs
      - run: bun scripts/guard-house-styles-api-evidence.mjs
      - run: node packages/cli/scripts/guard-diagnostics.mjs
      - run: node scripts/guard-release.mjs
      - run: node scripts/guard-ci.mjs
      # Cannot fail here — the install above always produces a complete tree.
      # Listed so a manifest declaring something the lockfile cannot supply is
      # caught, and so CI and `bun run guard` stay the same set.
      - run: node scripts/guard-deps.mjs

  built-node:
    name: Built Node ${{ matrix.node }} on ${{ matrix.os }} — e2e ${{ matrix.shard }}
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.12.0"
            shard: all
          - os: ubuntu-latest
            node: "24"
            shard: all
          - os: ubuntu-latest
            node: "26"
            shard: all
          - os: macos-latest
            node: "22.12.0"
            shard: all
          - os: windows-latest
            node: "22.12.0"
            shard: 1/2
          - os: windows-latest
            node: "22.12.0"
            shard: 2/2
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node scripts/guard-workspace.mjs
      - run: bun run build:kit
      - run: node --test packages/registry-kit/e2e/*.node-e2e.mjs
      # The dist-shape e2e validates public/r/empty-state.json, which is generated
      # and gitignored — without this it is simply absent on a fresh checkout.
      - run: bun run build:registry
      - run: bun --cwd=packages/cli run build
      - run: node packages/cli/scripts/run-e2e.mjs
        env:
          MANTEEN_E2E_SHARD: ${{ matrix.shard }}

  scaffold-proof:
    name: Scaffold proof — Node 20.11 and Mantine consumers
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "20.11.0"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node scripts/guard-workspace.mjs
      - run: bun run build:kit
      - run: node --test packages/registry-kit/e2e/*.node-e2e.mjs
      - run: node packages/registry-kit/scripts/verify-scaffold-consumers.mjs

  packed-consumer:
    name: Packed consumer — ${{ matrix.manager }} on ${{ matrix.os }}
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manager: npm
          - os: ubuntu-latest
            manager: pnpm
          - os: ubuntu-latest
            manager: yarn
          - os: ubuntu-latest
            manager: bun
          # The native npm shim is `manteen.cmd`; this is also the positive
          # caret-range test through tinyexec's Windows argv escaping.
          - os: windows-latest
            manager: npm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Provision the selected package manager
        shell: bash
        run: |
          case "${{ matrix.manager }}" in
            npm)  npm install --global npm@10.9.2 ;;
            pnpm)
              npm install --global corepack@0.34.0
              corepack enable
              corepack install --global pnpm@10.30.1
              ;;
            yarn)
              npm install --global corepack@0.34.0
              corepack enable
              corepack install --global yarn@4.9.2
              ;;
            bun)  bun --version ;;
          esac
      - run: bun install --frozen-lockfile
      - run: node scripts/guard-workspace.mjs
      - run: bun run build:kit
      - run: bun run build:registry
      - run: bun --cwd=packages/cli run build
      - name: Install and exercise the packed CLI
        shell: bash
        env:
          MANTEEN_E2E_PM: ${{ matrix.manager }}
        run: node --test packages/cli/e2e/packed-consumer.node-e2e.mjs

  # Branch protection needs one stable check whether the matrices ran or were
  # intentionally skipped for a docs-only PR.
  ci-gate:
    name: CI gate
    needs: [classify, quality, built-node, scaffold-proof, packed-consumer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILT_NODE_RESULT: ${{ needs.built-node.result }}
          SCAFFOLD_PROOF_RESULT: ${{ needs.scaffold-proof.result }}
          PACKED_CONSUMER_RESULT: ${{ needs.packed-consumer.result }}
        shell: bash
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$QUALITY_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$DOCS_ONLY" == "true" ]]; then
            [[ "$BUILT_NODE_RESULT" == "skipped" &&
               "$SCAFFOLD_PROOF_RESULT" == "skipped" &&
               "$PACKED_CONSUMER_RESULT" == "skipped" ]]
          else
            [[ "$BUILT_NODE_RESULT" == "success" &&
               "$SCAFFOLD_PROOF_RESULT" == "success" &&
               "$PACKED_CONSUMER_RESULT" == "success" ]]
          fi
