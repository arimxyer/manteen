name: Deploy registry

on:
  # Deliberately manual. A registry item can begin depending on a client
  # contract that the current npm release does not understand; deploying on
  # every main push would let the registry outrun that client. Publish the kit,
  # then the client, verify both, and dispatch this workflow last.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The registry is generated, never committed, so a queued run may safely
# discard an older one — the newest catalog always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Builds the toolchain, then compiles the catalog with the BUILT bundle
      # under Node rather than the TypeScript sources under Bun. Publishing the
      # registry and proving the published artifact runs on Node are the same
      # step, so a Bun-only API can never reach npm unnoticed again.
      - run: bun run verify:node
      - run: bun run build:site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
