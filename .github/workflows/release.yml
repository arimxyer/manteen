name: Release

# Per-package tags, because the two packages ship on their own schedules —
# manteen-kit is finished and useful now, the client is not.
#   manteen-kit-v0.1.0   ->  packages/registry-kit
#   manteen-v0.1.0       ->  packages/cli
on:
  push:
    tags:
      - "manteen-kit-v*"
      - "manteen-v*"

permissions:
  contents: read
  # Trusted publishing (OIDC). No NPM_TOKEN is stored anywhere: npm mints a
  # short-lived credential from this job's identity, which also means the
  # published package carries a verifiable provenance attestation.
  # Requires a trusted publisher configured for the package on npmjs.com,
  # pointing at this repo and this workflow file.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # npm does the publishing even though bun does the installing: `npm
      # publish` is what implements OIDC and provenance.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # npm 11.18 is above the OIDC and `npm trust` floors without moving the
      # release onto the npm 12 major published while W8 was being frozen.
      - run: npm install --global npm@11.18.0
      - name: Verify the exact release toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.18.0"
          test "$(bun --version)" = "1.3.14"

      - run: bun install --frozen-lockfile
      - run: node scripts/guard-workspace.mjs

      # A tag is not a promise that main was green when it was cut. Everything
      # CI runs, runs again here, because an unpublish is not a real remedy —
      # npm keeps the version number burned either way.
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: node scripts/guard-runtime-apis.mjs
      - run: node packages/cli/scripts/guard-diagnostics.mjs
      - run: node scripts/guard-release.mjs
      - run: bun run build:registry
      - run: bun --cwd=packages/cli run build
      - run: node packages/cli/scripts/run-e2e.mjs

      - name: Select the package for this tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            manteen-kit-v*) echo "dir=packages/registry-kit" >> "$GITHUB_OUTPUT" ;;
            manteen-v*)     echo "dir=packages/cli"          >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} matches no package"; exit 1 ;;
          esac

      # One guard owns tag selection, manifest metadata, workspace protocols,
      # changelog/license presence and the built `npm pack --dry-run` surface.
      - name: Guard the selected release
        run: node scripts/guard-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
