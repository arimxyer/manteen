name: Release

# Per-package tags, because the two packages ship on their own schedules —
# manteen-kit is finished and useful now, the client is not.
#   manteen-kit-v0.1.0   ->  packages/registry-kit
#   manteen-v0.1.0       ->  packages/cli
on:
  push:
    tags:
      - "manteen-kit-v*"
      - "manteen-v*"

permissions:
  contents: read
  # Trusted publishing (OIDC). No NPM_TOKEN is stored anywhere: npm mints a
  # short-lived credential from this job's identity, which also means the
  # published package carries a verifiable provenance attestation.
  # Requires a trusted publisher configured for the package on npmjs.com,
  # pointing at this repo and this workflow file.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # npm does the publishing even though bun does the installing: `npm
      # publish` is what implements OIDC and provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: node scripts/guard-workspace.mjs

      # A tag is not a promise that main was green when it was cut. Everything
      # CI runs, runs again here, because an unpublish is not a real remedy —
      # npm keeps the version number burned either way.
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: node scripts/guard-runtime-apis.mjs
      - run: node packages/cli/scripts/guard-diagnostics.mjs
      - run: bun run build:registry
      - run: bun --cwd=packages/cli run build
      - run: node --test packages/cli/e2e/*.node-e2e.mjs

      - name: Select the package for this tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            manteen-kit-v*) echo "dir=packages/registry-kit" >> "$GITHUB_OUTPUT" ;;
            manteen-v*)     echo "dir=packages/cli"          >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} matches no package"; exit 1 ;;
          esac

      # The tag is the source of truth for the version. A tag that disagrees
      # with package.json means one of the two was a mistake, and guessing which
      # is worse than stopping.
      - name: Verify the tag matches package.json
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          declared=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME##*-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag says $tagged, package.json says $declared"
            exit 1
          fi
          echo "publishing $(node -p "require('./package.json').name")@$declared"

      # `workspace:*` is meaningless to a consumer, and npm pack preserves it
      # verbatim. The client therefore declares a real kit range even while Bun
      # links the matching workspace package locally. Keep this assertion as a
      # last-line release guard over the actual tarball.
      - name: Reject a workspace protocol in the tarball
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if grep -q '"workspace:' package.json; then
            echo "::notice::package.json declares a workspace dependency; checking the packed manifest"
            npm pack --pack-destination /tmp >/dev/null
            tar -xzOf /tmp/*.tgz package/package.json | grep -q '"workspace:' \
              && { echo "::error::workspace: protocol survived into the tarball"; exit 1; } \
              || echo "rewritten correctly"
          fi

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
